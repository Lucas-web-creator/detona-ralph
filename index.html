<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fix-It Felix Jr. - Detona Ralph (Web Edition)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="arcade-cabinet">
    <header class="arcade-header">
      <h1>Fix-It Felix Jr.</h1>
    </header>
    
    <div class="screen-container">
      <canvas id="gameCanvas" width="500" height="600"></canvas>
      <div class="crt-overlay"></div>
    </div>

    <footer class="controls-guide">
      <p><strong>[A / D]</strong> ou <strong>[Setas ← →]</strong> Mover Lateralmente</p>
      <p><strong>[W / S]</strong> ou <strong>[Setas ↑ ↓]</strong> Subir / Descer Andar</p>
      <p><strong>[ESPAÇO]</strong> Consertar Janela</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
